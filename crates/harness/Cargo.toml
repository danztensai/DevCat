[package]
name = "devcat-harness"
version = "0.1.0"
edition = "2024"
description = "DevCat's own coding-agent harness: agent loop, session log, model adapters and tools"
publish = false

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
