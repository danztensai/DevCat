[package]
name = "devcat-remote-proto"
version = "0.1.0"
edition = "2024"
description = "DevCat remote access: wire protocol shared by the desktop host and the mobile app"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
ring = { version = "0.17", optional = true }

[features]
# Browser-session crypto (host side; the browser does the same in JavaScript).
crypto = ["dep:ring"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
