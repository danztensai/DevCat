[package]
name = "devcat-web-iroh"
version = "0.1.0"
edition = "2024"
publish = false
description = "DevCat Mobile in a browser on any network: an iroh endpoint (relay only) for the hosted page"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
devcat-remote-proto = { path = "../../crates/remote-proto" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
hex = "0.4"
tokio = { version = "1", default-features = false, features = ["sync"] }
n0-future = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
