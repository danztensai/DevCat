# Quick check that the macOS release certificate can sign on a GitHub runner (no app build).
# Run it from the Actions tab after changing the certificate or the signing setup in build.yml.
name: signing-check

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust, import and sign a test binary
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/devcat-codesign.crt
          kc="$RUNNER_TEMP/sign.keychain-db"; kp=$(openssl rand -hex 12)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security import "$RUNNER_TEMP/c.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q '1 valid identities found'
          cp /bin/echo "$RUNNER_TEMP/t"
          codesign --force --keychain "$kc" -s "DevCat Self-Signed" -i dev.devcat.app --options runtime "$RUNNER_TEMP/t"
          codesign -d -r- "$RUNNER_TEMP/t" 2>&1 | grep -i 'certificate root = H"ae681e9b28c61cdcce19d63e05a6aac8a67f637d"'
          "$RUNNER_TEMP/t" signed-binary-runs
