# Builds DevCat installers for macOS (Apple Silicon + Intel), Windows and Linux.
# Push a tag like `v0.1.0` to publish a GitHub release with the installers attached,
# or run it manually from the Actions tab to get them as workflow artifacts.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            args: ""
            rust_targets: ""
            label: windows-x64
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}
      - run: pnpm install --frozen-lockfile

      # macOS release signing with DevCat's self-signed certificate (.github/devcat-codesign.crt;
      # the .p12 is a repository secret). Unlike ad-hoc signing, the signature's identity stays the
      # same across versions, so the Keychain keeps "Always Allow" for saved passwords after an
      # update. Not notarized: Gatekeeper still asks once on first install. Without the secret the
      # build stays ad-hoc signed.
      - name: Set up code signing (macOS)
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # codesign only uses identities the system trusts; trust the cert on this throwaway runner.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/devcat-codesign.crt
          {
            echo "APPLE_CERTIFICATE=$CERT_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=DevCat Self-Signed"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app verifies them with the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DevCat ${{ github.ref_name }}
          releaseBody: |
            Downloads for this release are below. Already on v0.3.0 or later? DevCat offers the update itself.

            - **macOS (Apple Silicon):** `DevCat_*_aarch64.dmg`
            - **macOS (Intel):** `DevCat_*_x64.dmg`
            - **Windows:** `DevCat_*_x64-setup.exe` or `DevCat_*_x64_en-US.msi`
            - **Linux:** `.AppImage`, `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/RHEL)

            The builds are not notarized by Apple / signed for Windows yet.
            **macOS:** after dragging DevCat to Applications, open it once; when macOS says it can't verify
            the developer, go to *System Settings → Privacy & Security* and click **Open Anyway**
            (or run `xattr -dr com.apple.quarantine /Applications/DevCat.app` in Terminal).
            **Windows:** SmartScreen may warn: choose "More info" → "Run anyway".
          releaseDraft: false
          # latest.json: what the in-app updater reads (releases/latest/download/latest.json)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        run: |
          app=$(find src-tauri/target -maxdepth 6 -path '*/release/bundle/macos/DevCat.app' | head -1)
          codesign --verify --deep --strict "$app"
          req=$(codesign -d -r- "$app" 2>&1)
          echo "$req"
          echo "$req" | grep -q 'certificate leaf' || { echo "::error::DevCat.app is not signed with the release certificate"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: devcat-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
