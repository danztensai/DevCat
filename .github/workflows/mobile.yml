# Builds DevCat Mobile (mobile/): an Android APK, and an iOS compile check.
# Runs on version tags (the APK is attached to the release) and manually from the Actions tab.
#
# Android signing: with the ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS secrets the release APK is signed with that key (updates install over each
# other). Without them a debug-signed APK is built: installable, but each build's signature differs.
# iOS: installing on an iPhone needs an Apple Developer account; see mobile/README.md.
name: mobile

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK (ANDROID_HOME); add the NDK and the pieces we use.
      - name: Install the Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          key: android
      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: mobile
        run: ../node_modules/.bin/tauri android init --ci

      - name: Build (release, signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ../node_modules/.bin/tauri android build --apk
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal-release-unsigned.apk' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --out "$GITHUB_WORKSPACE/DevCat-Mobile.apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Build (debug-signed)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: mobile
        run: |
          ../node_modules/.bin/tauri android build --apk --debug
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal-debug.apk' | head -1)" "$GITHUB_WORKSPACE/DevCat-Mobile.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DevCat-Mobile-android
          path: DevCat-Mobile.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DevCat-Mobile.apk

  ios:
    # Compile check only: an installable iPhone build needs Apple signing (mobile/README.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - name: Build the app library for iPhone and the simulator
        working-directory: mobile/src-tauri
        run: |
          cargo build --release --lib --target aarch64-apple-ios
          cargo build --lib --target aarch64-apple-ios-sim
